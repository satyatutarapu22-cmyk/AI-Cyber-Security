{% extends "base.html" %}{% block content %}<h1>Threat Reports</h1><div class="panel"><h2>Attack Classification Summary</h2><table><tr><th>Attack Type</th><th>Severity</th><th>Count</th></tr>{% for r in rows %}<tr><td>{{r.attack_type}}</td><td><span class="badge {{r.severity|lower}}">{{r.severity}}</span></td><td>{{r.count}}</td></tr>{% else %}<tr><td colspan="3">No detection data yet.</td></tr>{% endfor %}</table></div>{% endblock %}
