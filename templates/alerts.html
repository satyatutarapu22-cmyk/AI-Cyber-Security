{% extends "base.html" %}{% block content %}<h1>Security Alerts</h1><div class="panel"><table><tr><th>ID</th><th>Type</th><th>Severity</th><th>Message</th><th>Status</th><th>Time</th></tr>
{% for a in alerts %}<tr><td>{{a.id}}</td><td>{{a.attack_type}}</td><td><span class="badge {{a.severity|lower}}">{{a.severity}}</span></td><td>{{a.message}}</td><td>{{a.status}}</td><td>{{a.created_at}}</td></tr>{% else %}<tr><td colspan="6">No alerts yet.</td></tr>{% endfor %}</table></div>{% endblock %}
